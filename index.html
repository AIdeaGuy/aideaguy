<style>
/* Layout: phone first. Sticky top bar, one task per screen, bottom tab bar on phones that moves to the top bar from 720px.
   Accent only on the main action and the current tab. One family (Inter) for the tool; Bricolage only for the landing headline. */
:root{
  --bg:#f6f8fa; --surface:#ffffff; --fg:#13202b; --mut:#566573; --line:#d5dde5; --field:#ffffff;
  --accent:#0b7a6b; --accent-fg:#ffffff; --accent-soft:#e1f2ef; --note:#fbefd9;
  --f-head:"Bricolage Grotesque","Inter","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --bar-h:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161d; --surface:#16212b; --fg:#e8eef3; --mut:#9aabb9; --line:#2a3b4c; --field:#0e161d;
  --accent:#4fd1bd; --accent-fg:#06201b; --accent-soft:#12302c; --note:#33260f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161d; --surface:#16212b; --fg:#e8eef3; --mut:#9aabb9; --line:#2a3b4c; --field:#0e161d;
  --accent:#4fd1bd; --accent-fg:#06201b; --accent-soft:#12302c; --note:#33260f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:1rem/1.55 var(--f-body);-webkit-text-size-adjust:100%}
::selection{background:var(--accent);color:var(--accent-fg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent);text-underline-offset:3px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-family:var(--f-head);font-weight:800;font-size:clamp(2rem,9vw,3rem);letter-spacing:-.02em}
h2{font-size:1.4rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0 0 .75rem;max-width:65ch}
.mut{color:var(--mut)}
.small{font-size:.9rem}

/* top bar + nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;justify-content:space-between;height:var(--bar-h);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
.brand{font:800 1.2rem var(--f-head);letter-spacing:-.01em;text-decoration:none;color:var(--fg)}
.priv{font-size:.8rem;color:var(--mut)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;min-height:56px;font-size:.78rem;font-weight:500;color:var(--mut);text-decoration:none}
nav.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding-top:24px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:720px){
  nav.tabs{position:static;border:0;background:none;padding:0;gap:4px}
  nav.tabs a{flex-direction:row;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;font-size:.95rem}
  nav.tabs a[aria-current="page"]{background:var(--accent-soft)}
  .top{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .priv{display:none}
  .wrap{padding-bottom:64px;padding-top:40px}
}

/* controls */
.btn,.ghost,.chip{min-height:48px;border-radius:12px;padding:12px 18px;border:1px solid var(--line);background:var(--surface);font-weight:500;transition:border-color .15s,background-color .15s}
.btn{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600;width:100%}
.btn:hover{filter:brightness(1.06)}
.ghost{background:transparent;width:100%}
.ghost:hover,.chip:hover{border-color:var(--accent)}
.chip{text-align:left;width:100%}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.stack{display:grid;gap:10px;margin-top:16px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline .chip{width:auto;flex:1 1 auto;text-align:center}
@media (min-width:480px){.btn,.ghost{width:auto}}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--accent);min-height:44px;text-decoration:underline;text-underline-offset:3px;text-align:left}
textarea,input[type=text],input[type=email]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-size:1rem;line-height:1.45;min-height:48px}
textarea{min-height:84px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--mut)}
label{display:block;font-weight:600;margin-bottom:4px}
.help{font-size:.9rem;color:var(--mut);margin-bottom:8px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 20px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s ease-out}
.back{margin-top:12px}

/* content blocks (plain, not cards) */
.hero p.lede{font-size:1.15rem;margin-top:12px}
.hero .btn{margin-top:20px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.steps b{display:block}
.sect{margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.note{background:var(--note);border-radius:10px;padding:12px 14px;margin:14px 0}
.soft{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:14px 0}
.tips{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:14px}
.tips li .t{display:block}
.rate{display:flex;gap:8px;margin-top:4px}
.rate button{min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:.88rem;color:var(--mut)}
.rate button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:600}
.plain{margin:10px 0 0;padding-left:1.2rem;display:grid;gap:8px}
pre.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font:.92rem/1.5 var(--f-body);margin:8px 0 0}
.vote{display:grid;gap:8px;margin:10px 0}
.vote div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;overflow-wrap:anywhere}
.vote b{font-weight:600}
.slot{margin-top:20px}
.slot form{display:grid;gap:10px}
.follow{margin-top:28px}
.follow a{margin-right:16px}

/* card form */
details.f{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:10px 0}
details.f>summary{list-style:none;cursor:pointer;padding:14px 16px;min-height:52px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:600}
details.f>summary::-webkit-details-marker{display:none}
details.f>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);flex:none;transition:transform .15s}
details.f[open]>summary::after{transform:rotate(-135deg)}
details.f .body{padding:0 16px 16px}
.tagc{font-size:.78rem;font-weight:500;color:var(--mut);margin-left:6px}
.tagc.must{color:var(--accent);font-weight:600}
.cnt{font-size:.9rem;color:var(--mut);margin:4px 0 10px}
.err{color:#b3261e;font-size:.92rem;margin-top:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff9a8f}}
:root[data-theme="dark"] .err{color:#ff9a8f}

/* checklist + cards */
.todo{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px}
.todo label{display:flex;gap:12px;align-items:flex-start;font-weight:400;margin:0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:48px;cursor:pointer}
.todo input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)}
.todo input:checked+span{color:var(--mut);text-decoration:line-through}
.cardbox{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:12px 0}
.cardbox .row{padding:12px 14px;border-top:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap}
.cardbox .row:first-child{border-top:0}
.cardbox b{display:block;font-size:.85rem;color:var(--mut);font-weight:600}
.stats{display:flex;gap:24px;margin:8px 0 16px}
.stats b{display:block;font:700 1.6rem var(--f-head);font-variant-numeric:tabular-nums}
.empty{padding:20px;border:1px dashed var(--line);border-radius:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  var CHECKPROMPT="List every factual claim in your last answer (numbers, dates, names, quotes).\nMark the 2 that matter most for my decision.\nFor each one, tell me how likely you are to be wrong and how I can check it myself.";
